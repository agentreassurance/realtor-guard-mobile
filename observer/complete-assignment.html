<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assignment Complete | Realtor Guard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:95%;
    max-width:420px;
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    font-size:55px;
}

h1{
    text-align:center;
    color:#b00000;
    margin-top:10px;
    margin-bottom:20px;
}

.status{
    background:#e8f8ea;
    color:#0b6b25;
    text-align:center;
    padding:15px;
    border-radius:12px;
    font-weight:bold;
    margin-bottom:25px;
}

.earnings{
    background:#f8f8f8;
    border-radius:12px;
    padding:18px;
    text-align:center;
    margin-bottom:20px;
}

.earnings h2{
    color:#444;
    margin-bottom:10px;
}

.amount{
    font-size:40px;
    font-weight:bold;
    color:#0b6b25;
}

button{
    width:100%;
    border:none;
    border-radius:10px;
    padding:15px;
    font-size:17px;
    font-weight:bold;
    margin-top:12px;
    cursor:pointer;
}

.cashout{
    background:#0b6b25;
    color:white;
}

.bank{
    background:#003366;
    color:white;
}

.history{
    background:#777;
    color:white;
}

.rate{
    background:#b00000;
    color:white;
}

.dashboard{
    background:black;
    color:white;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🛡️</div>

<h1>Assignment Complete</h1>

<div class="status">
✅ Great job!<br><br>
Your assignment has been completed successfully.
</div>

<div class="earnings">
<h2>Total Earnings</h2>
<div class="amount">$35.00</div>
</div>

<button class="cashout">
⚡ Instant Cash Out
</button>

<button class="bank">
🏦 Transfer to Bank
</button>

<button class="history">
📄 Earnings History
</button>

<button class="rate">
⭐ Rate Agent
</button>

<button class="dashboard"
onclick="location.href='dashboard.html'">
🏠 Return to Dashboard
</button>

</div>

</body>
</html>
