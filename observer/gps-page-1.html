     padding: 18px;

#startBtn {

  color: white;

display: inline-block;

  min-width: 125px;
  padding: 12px 24px;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  font-weight: bold;
}

    #startBtn:disabled {
     background: #00843D;
      cursor: not-allowed;
    }

    .back {
      background: #f0f0f0;
      color: #222;
    }

    #status {
      font-size: 14px;
      margin: 10px 0;
    }

    #details {
      font-size: 14px;
      margin: 8px 0;
      font-weight: bold;
    }

    .leaflet-control-attribution {
      font-size: 10px;
    }

    @media (max-width: 600px) {
      .panel {
        bottom: 10px;
        left: 8px;
        right: 8px;
        padding: 13px;
      }
    }
  </style>
</head>

<body>


  <div style="position:fixed;top:18px;left:16px;right:16px;max-width:650px;margin:0 auto;z-index:1000;">
 <input
  id="address"
  type="text"
  placeholder="Enter property address"
  autocomplete="street-address"
  style="width:100%;box-sizing:border-box;height:76px;padding:16px 22px;font-size:26px;font-weight:500;color:#333333;background:#ffffff;border:1px solid #d1d5db;border-radius:18px;outline:none;"
>
 </div>
    <div id="map"></div>

  <div class="panel">
    <h2>GPS Route Preview</h2>
    
<div style="display:flex;justify-content:space-between;align-items:center;gap:5px;margin:15px 0 20px;text-align:center;">

 
<div id="driveIcon"
     role="button"
     tabindex="0"
     onclick="showDriveDetails()"
     onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showDriveDetails();}"
     style="flex:1;color:black;font-weight:bold;font-size:13px;cursor:pointer;">
  

<div style="color:#444444;">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <path d="M5 17h14M3 12h18"/>

    <circle cx="17" cy="17" r="2"/>
  </svg>
</div>

</div>

    Transportation
  </div>

  <div style="flex:1;color:black;font-weight:bold;font-size:13px;">
   
<div style="color:#444444;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="m7 21 3-5"/><path d="m16 21-2-5-3-3 1-5"/><path d="m6 12 3-3 3 1 3 3 3 1"/></svg></div>

    Walk
  </div>

  <div style="flex:1;color:black;font-weight:bold;font-size:13px;">
   
<div style="color:#444444;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="m15 6 2 0 3.5 11.5M5.5 17.5 10 9h4l4.5 8.5M10 9l-2-3H6M10 9l4.5 8.5H5.5"/></svg></div>

    Bike
  </div>

<button id="routeBtn" style="display: none !important;">Find Driving Route</button>



    <p id="status">Waiting for your GPS location...</p>
 
<p id="details" style="font-size:32px;font-weight:700;color:#333333;line-height:1.3;margin:14px 0;"></p>


    <button id="startBtn" disabled>
     ➤ Start
    </button>
<button id="addStopsBtn" type="button" style="display:inline-block;width:auto;margin-left:10px;padding:12px 24px;border:0;border-radius:30px;background:#D8F5FA;color:#176875;font-size:16px;font-weight:bold;cursor:pointer;">⊕ Add stops</button>
<button id="shareBtn" type="button" onclick="navigator.share ? navigator.share({title:'Realtor Guard GPS',url:location.href}).catch(()=>{}) : navigator.clipboard.writeText(location.href).then(()=>alert('Link copied!')).catch(()=>alert('Sharing unavailable'))" style="display:inline-block;width:auto;margin-left:10px;padding:12px 24px;border:0;border-radius:30px;background:#D8F5FA;color:#075E70;font-size:16px;font-weight:bold;cursor:pointer;">↗ Share</button>

<button id="saveBtn" type="button" onclick="localStorage.setItem('rgSavedGpsPage1',location.href);this.textContent='▣ Saved';" style="display:inline-block;width:auto;margin-left:10px;padding:12px 24px;border:0;border-radius:30px;background:#D8F5FA;color:#075E70;font-size:16px;font-weight:bold;cursor:pointer;">▯ Save</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script>
    // Paste your Geoapify Production API key below.
    const GEOAPIFY_KEY = "be47816624ba450db8927d887bf40d5d";

    const $ = id => document.getElementById(id);

    const params = new URLSearchParams(window.location.search);

    const suppliedAddress =
      params.get("address") ||
      params.get("destination") ||
      params.get("property_address") ||
      "";

    $("address").value = suppliedAddress;

    const map = L.map("map", {
      zoomControl: true
    }).setView([37.54, -77.44], 11);

    // Confirmed Geoapify Positron map.
  
L.tileLayer(
  "https://maps.geoapify.com/v1/tile/positron/{z}/{x}/{y}.png?apiKey=" +
    encodeURIComponent(GEOAPIFY_KEY),
  {
    maxZoom: 20,
    attribution: '&copy; OpenStreetMap contributors | Powered by Geoapify'
  }
).addTo(map);


    let currentPosition = null;
    let userMarker = null;
    let destinationMarker = null;
    let routeLine = null;
    let routeDestination = null;
let autoRouteStarted = false;
    function setStatus(message) {
      $("status").textContent = message;
    }

    function updatePosition(lat, lon) {
      currentPosition = [lat, lon];

      if (!userMarker) {
        userMarker = L.circleMarker(currentPosition, {
          radius: 9,
          color: "white",
          weight: 3,
          fillColor: "#06245c",
          fillOpacity: 1
        }).addTo(map);

        map.setView(currentPosition, 14);
      } else {
        userMarker.setLatLng(currentPosition);
      }

      
    if (!routeLine) {
      setStatus("GPS location ready.");
      if ($("address").value.trim() && !autoRouteStarted) {
        autoRouteStarted = true;
        findDrivingRoute();
      }
    }

    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        position => {
          updatePosition(
            position.coords.latitude,
            position.coords.longitude
          );
        },
        error => {
          setStatus(
            "GPS unavailable: " + error.message +
            ". Allow location access and try again."
          );
        },
        {
          enableHighAccuracy: true,
          maximumAge: 10000,
          timeout: 20000
        }
      );
    } else {
      setStatus("GPS is not supported by this browser.");
    }

    async function geoapifyJSON(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(
          "Geoapify request failed (" + response.status + ")"
        );
      }

      return response.json();
    }

    async function findDrivingRoute() {
      const address = $("address").value.trim();

      $("startBtn").disabled = true;
      $("details").textContent = "";
      routeDestination = null;

      if (routeLine) {
        map.removeLayer(routeLine);
        routeLine = null;
      }

      if (!address) {
        setStatus("Please enter the property address.");
        return;
      }

      if (!currentPosition) {
        setStatus("Waiting for GPS. Allow location access.");
        return;
      }

      if (
        !GEOAPIFY_KEY ||
        GEOAPIFY_KEY === "PASTE_YOUR_GEOAPIFY_KEY_HERE"
      ) {
        setStatus("Geoapify API key must be added first.");
        return;
      }

      $("routeBtn").disabled = true;
      setStatus("Finding property and calculating route...");

      try {
        const geocodeURL =
          "https://api.geoapify.com/v1/geocode/search?text=" +
          encodeURIComponent(address) +
          "&limit=1&apiKey=" +
          encodeURIComponent(GEOAPIFY_KEY);

        const locationData = await geoapifyJSON(geocodeURL);
        const feature = locationData.features?.[0];

        if (!feature) {
          throw new Error("Property address not found.");
        }

        const lon = feature.geometry.coordinates[0];
        const lat = feature.geometry.coordinates[1];

        routeDestination = [lat, lon];

        if (destinationMarker) {
          map.removeLayer(destinationMarker);
        }

        destinationMarker = L.marker(
          routeDestination
        ).addTo(map);

        const waypoints =
          currentPosition[0] + "," + currentPosition[1] +
          "|" + lat + "," + lon;

        const routingURL =
          "https://api.geoapify.com/v1/routing?waypoints=" +
          encodeURIComponent(waypoints) +
          "&mode=drive&apiKey=" +
          encodeURIComponent(GEOAPIFY_KEY);

        const routeData = await geoapifyJSON(routingURL);
        const route = routeData.features?.[0];

        if (!route) {
          throw new Error("No driving route was found.");
        }

        routeLine = L.geoJSON(route, {
          style: {
            color: "#123fba",
            weight: 7,
            opacity: 0.95
          }
        }).addTo(map);

        map.fitBounds(routeLine.getBounds(), {
          padding: [40, 40],
          maxZoom: 16
        });

        const distance =
          route.properties?.distance || 0;

        const time =
          route.properties?.time || 0;

        const miles = (distance / 1609.344).toFixed(1);
        const minutes = Math.ceil(time / 60);

        $("details").textContent =
          miles + " miles | About " + minutes + " minutes";

        setStatus("Driving route ready.");
        $("startBtn").disabled = false;

      } catch (error) {
        setStatus(error.message);
        $("startBtn").disabled = true;
      } finally {
        $("routeBtn").disabled = false;
      }
    }

    $("routeBtn").addEventListener(
      "click",
      findDrivingRoute
    );

    $("startBtn").addEventListener("click", () => {
      if (!routeDestination) return;

      const next = new URL(
        "navigation-live.html",
        window.location.href
      );

      next.searchParams.set(
        "address",
        $("address").value.trim()
      );

      next.searchParams.set(
        "lat",
        String(routeDestination[0])
      );

      next.searchParams.set(
        "lon",
        String(routeDestination[1])
      );

      window.location.href = next.href;
    });
  
function showDriveDetails() {
  const details = document.getElementById("details");
  const address = document.getElementById("address").value.trim();

  if (!details) return;

  if (!address) {
    details.textContent =
      "🚗 Drive: Enter the property address to view driving directions.";
    return;
  }

  details.textContent =
    "🚗 Driving to: " + address +
    " | " + (routeDestination
      ? "Driving route information is shown after the route is calculated."
      : "Waiting for driving route information.");
}

  </script>
</body>
</html>
