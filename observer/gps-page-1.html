
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realtor Guard | GPS Page 1</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

  <style>
  /* GPS transportation icons */
.transport-icon {
  font-size: 24px;
  color: #444444;
}
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: white;
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
     background: #f2f6f9;
    }

    
.panel {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: white;
  border-radius: 28px 28px 0 0;
  padding: 20px 18px 24px;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
  max-height: 65vh;
  overflow-y: auto;
}


    h2 {
      font-size: 19px;
      margin: 0 0 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button, .back {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 30px;
     padding: 18px;
      margin-top: 10px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    #routeBtn {
      background: #06245c;
      color: white;
    }

    
#startBtn {
  background: #008C95;
  color: white;
  width: auto;
  
display: inline-block;

  min-width: 125px;
  padding: 12px 24px;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  font-weight: bold;
}

    #startBtn:disabled {
     background: #00843D;
      cursor: not-allowed;
    }

    .back {
      background: #f0f0f0;
      color: #222;
    }

    #status {
      font-size: 14px;
      margin: 10px 0;
    }

    #details {
      font-size: 14px;
      margin: 8px 0;
      font-weight: bold;
    }

    .leaflet-control-attribution {
      font-size: 10px;
    }

    @media (max-width: 600px) {
      .panel {
        bottom: 10px;
        left: 8px;
        right: 8px;
        padding: 13px;
      }
    }
  </style>
</head>

<body>


  <div style="position:fixed;top:18px;left:16px;right:16px;max-width:650px;margin:0 auto;z-index:1000;">
 <input
  id="address"
  type="text"
  placeholder="Enter property address"
  autocomplete="street-address"
  style="width:100%;box-sizing:border-box;height:76px;padding:16px 22px;font-size:26px;font-weight:500;color:#333333;background:#ffffff;border:1px solid #d1d5db;border-radius:18px;outline:none;"
>
 </div>
    <div id="map"></div>

  <div class="panel">
<h2 style="text-align:center;color:#111111;font-size:28px;font-weight:800;line-height:1.4;margin:16px 0 24px;">Observers, Please Arrive On Time.<span style="display:block;font-size:22px;margin-top:10px;">Thank You!</span></h2>
    


   



<button id="routeBtn" style="display: none !important;">Find Driving Route</button>



    <p id="status">Waiting for your GPS location...</p>
 



    <button id="startBtn" disabled style="display:block;width:100%;min-height:76px;padding:20px 30px;border:0;border-radius:40px;background:#CC0000;color:white;font-size:24px;font-weight:700;cursor:pointer;">
     ➤ Start
    </button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script>
    // Paste your Geoapify Production API key below.
    const GEOAPIFY_KEY = "be47816624ba450db8927d887bf40d5d";

    const $ = id => document.getElementById(id);

    const params = new URLSearchParams(window.location.search);

    const suppliedAddress =
      params.get("address") ||
      params.get("destination") ||
      params.get("property_address") ||
      "";

    $("address").value = suppliedAddress;

    const map = L.map("map", {
      zoomControl: true
    }).setView([37.54, -77.44], 11);

    // Confirmed Geoapify Positron map.
  
L.tileLayer(
  "https://maps.geoapify.com/v1/tile/positron/{z}/{x}/{y}.png?apiKey=" +
    encodeURIComponent(GEOAPIFY_KEY),
  {
    maxZoom: 20,
    attribution: '&copy; OpenStreetMap contributors | Powered by Geoapify'
  }
).addTo(map);


    let currentPosition = null;
    let userMarker = null;
    let destinationMarker = null;
    let routeLine = null;
    let routeDestination = null;
let autoRouteStarted = false;
    function setStatus(message) {
      $("status").textContent = message;
    }

    function updatePosition(lat, lon) {
      currentPosition = [lat, lon];

      if (!userMarker) {
        userMarker = L.circleMarker(currentPosition, {
          radius: 9,
          color: "white",
          weight: 3,
          fillColor: "#06245c",
          fillOpacity: 1
        }).addTo(map);

        map.setView(currentPosition, 14);
      } else {
        userMarker.setLatLng(currentPosition);
      }

      
    if (!routeLine) {
      setStatus("GPS location ready.");
      if ($("address").value.trim() && !autoRouteStarted) {
        autoRouteStarted = true;
        findDrivingRoute();
      }
    }

    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        position => {
          updatePosition(
            position.coords.latitude,
            position.coords.longitude
          );
        },
        error => {
          setStatus(
            "GPS unavailable: " + error.message +
            ". Allow location access and try again."
          );
        },
        {
          enableHighAccuracy: true,
          maximumAge: 10000,
          timeout: 20000
        }
      );
    } else {
      setStatus("GPS is not supported by this browser.");
    }

    async function geoapifyJSON(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(
          "Geoapify request failed (" + response.status + ")"
        );
      }

      return response.json();
    }

    async function findDrivingRoute() {
      const address = $("address").value.trim();

      $("startBtn").disabled = true;
    
      routeDestination = null;

      if (routeLine) {
        map.removeLayer(routeLine);
        routeLine = null;
      }

      if (!address) {
        setStatus("Please enter the property address.");
        return;
      }

      if (!currentPosition) {
        setStatus("Waiting for GPS. Allow location access.");
        return;
      }

      if (
        !GEOAPIFY_KEY ||
        GEOAPIFY_KEY === "PASTE_YOUR_GEOAPIFY_KEY_HERE"
      ) {
        setStatus("Geoapify API key must be added first.");
        return;
      }

      $("routeBtn").disabled = true;
      setStatus("Finding property and calculating route...");

      try {
        const geocodeURL =
          "https://api.geoapify.com/v1/geocode/search?text=" +
          encodeURIComponent(address) +
          "&limit=1&apiKey=" +
          encodeURIComponent(GEOAPIFY_KEY);

        const locationData = await geoapifyJSON(geocodeURL);
        const feature = locationData.features?.[0];

        if (!feature) {
          throw new Error("Property address not found.");
        }

        const lon = feature.geometry.coordinates[0];
        const lat = feature.geometry.coordinates[1];

        routeDestination = [lat, lon];

        if (destinationMarker) {
          map.removeLayer(destinationMarker);
        }

        destinationMarker = L.marker(
          routeDestination
        ).addTo(map);

        const waypoints =
          currentPosition[0] + "," + currentPosition[1] +
          "|" + lat + "," + lon;

        const routingURL =
          "https://api.geoapify.com/v1/routing?waypoints=" +
          encodeURIComponent(waypoints) +
          "&mode=drive&apiKey=" +
          encodeURIComponent(GEOAPIFY_KEY);

        const routeData = await geoapifyJSON(routingURL);
        const route = routeData.features?.[0];

        if (!route) {
          throw new Error("No driving route was found.");
        }

        routeLine = L.geoJSON(route, {
          style: {
            color: "#123fba",
            weight: 7,
            opacity: 0.95
          }
        }).addTo(map);

        map.fitBounds(routeLine.getBounds(), {
          padding: [40, 40],
          maxZoom: 16
        });

        const distance =
          route.properties?.distance || 0;

        const time =
          route.properties?.time || 0;

        const miles = (distance / 1609.344).toFixed(1);
        const minutes = Math.ceil(time / 60);

       
        setStatus("Driving route ready.");
        $("startBtn").disabled = false;

      } catch (error) {
        setStatus(error.message);
        $("startBtn").disabled = true;
      } finally {
        $("routeBtn").disabled = false;
      }
    }

    $("routeBtn").addEventListener(
      "click",
      findDrivingRoute
    );

    $("startBtn").addEventListener("click", () => {
      if (!routeDestination) return;

      const next = new URL(
             "gps-page-2.html",
        window.location.href
      );

      next.searchParams.set(
        "address",
        $("address").value.trim()
      );

      next.searchParams.set(
        "lat",
        String(routeDestination[0])
      );

     
next.searchParams.set(
  "lon",
  String(routeDestination[1])
);

next.searchParams.set(
  "date",
  params.get("date") || ""
);

next.searchParams.set(
  "time",
  params.get("time") || ""
);

const assignmentId =
  params.get("assignment_id") ||
  params.get("id") ||
  sessionStorage.getItem("activeAssignmentId") ||
  sessionStorage.getItem("rg_assignment_id");

if (assignmentId) {
  next.searchParams.set("assignment_id", assignmentId);
}

window.location.href = next.href;
});

  
function showDriveDetails() {
  const details = document.getElementById("details");
  const address = document.getElementById("address").value.trim();

  if (!details) return;

  if (!address) {
    details.textContent =
      "🚗 Drive: Enter the property address to view driving directions.";
    return;
  }

  details.textContent =
    "🚗 Driving to: " + address +
    " | " + (routeDestination
      ? "Driving route information is shown after the route is calculated."
      : "Waiting for driving route information.");
}

  </script>
</body>
</html>
