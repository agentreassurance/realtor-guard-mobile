<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Realtor Guard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    .header {
      width: 100%;
      padding: 18px 20px;
      border-bottom: 1px solid #eeeeee;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: #8b0000;
      font-size: 22px;
      font-weight: 700;
    }

    .menu {
      color: #8b0000;
      font-size: 30px;
      line-height: 1;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    h1 {
      text-align: center;
      color: #8b0000;
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    .photo-wrap {
      text-align: center;
      margin-bottom: 25px;
    }

    #profilePhoto {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #8b0000;
      display: none;
      margin: 0 auto;
    }

    .photo-placeholder {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #f2f2f2;
      border: 3px solid #8b0000;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 14px;
      text-align: center;
      padding: 10px;
    }

    .status {
      text-align: center;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      background: #f7f7f7;
      color: #555;
    }

    .error {
      background: #fff0f0;
      color: #a00000;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 700;
      color: #444;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 16px;
      background: #f8f8f8;
      color: #222;
    }

    input:disabled {
      opacity: 1;
      color: #222;
      -webkit-text-fill-color: #222;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #editBtn {
      background: #8b0000;
      color: white;
    }

    #submitBtn {
      background: #8b0000;
      color: white;
      display: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #8b0000;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="brand">Realtor Guard</div>
    <div class="menu">&#9776;</div>
  </div>

  <main class="container">

    <h1>My Profile</h1>
    <div class="subtitle">Observer Profile</div>

    <div id="status" class="status">
      Loading your profile...
    </div>

    <div class="photo-wrap">
      <img id="profilePhoto" alt="Observer profile photo">

      <div id="photoPlaceholder" class="photo-placeholder">
        Profile Photo
      </div>
    </div>

    <form id="profileForm">

      <label for="full_name">Full Name</label>
      <input id="full_name" disabled>

      <label for="email">Email</label>
      <input id="email" type="email" disabled>

      <label for="phone">Phone</label>
      <input id="phone" disabled>

      <label for="address">Address</label>
      <input id="address" disabled>

      <label for="license_id">License Number</label>
      <input id="license_id" disabled>

      <label for="license_expiration_date">
        License Expiration Date
      </label>
      <input id="license_expiration_date" type="date" disabled>

      <div class="buttons">
        <button type="button" id="editBtn">Edit</button>
        <button type="submit" id="submitBtn">Submit</button>
      </div>

    </form>

    <a class="back" href="dashboard.html">
      Back to Dashboard
    </a>

  </main>

<script>
  // ==========================================
  // PASTE YOUR EXISTING SUPABASE VALUES HERE
  // ==========================================

  const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL_HERE";
  const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const statusBox = document.getElementById("status");
  const form = document.getElementById("profileForm");
  const editBtn = document.getElementById("editBtn");
  const submitBtn = document.getElementById("submitBtn");

  const editableFields = [
    "full_name",
    "phone",
    "address",
    "license_id",
    "license_expiration_date"
  ];

  let loggedInUser = null;
  let observerProfile = null;

  async function loadProfile() {

    try {

      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();

      if (userError) {
        throw userError;
      }

      if (!user) {
        statusBox.textContent =
          "No logged-in observer was found. Please log in again.";

        statusBox.classList.add("error");
        return;
      }

      loggedInUser = user;

      const {
        data,
        error
      } = await supabaseClient
        .from("observers")
        .select("*")
        .eq("auth_user_id", user.id)
        .maybeSingle();

      if (error) {
        throw error;
      }

      if (!data) {
        statusBox.textContent =
          "Your observer profile could not be found.";

        statusBox.classList.add("error");
        return;
      }

      observerProfile = data;

      document.getElementById("full_name").value =
        data.full_name || "";

      document.getElementById("email").value =
        data.email || user.email || "";

      document.getElementById("phone").value =
        data.phone || "";

      document.getElementById("address").value =
        data.address || "";

      document.getElementById("license_id").value =
        data.license_id || "";

      document.getElementById("license_expiration_date").value =
        data.license_expiration_date || "";

      if (data.selfie_url) {

        const photo =
          document.getElementById("profilePhoto");

        photo.src = data.selfie_url;
        photo.style.display = "block";

        document.getElementById(
          "photoPlaceholder"
        ).style.display = "none";
      }

      statusBox.textContent =
        "Profile loaded successfully.";

      statusBox.classList.remove("error");

    } catch (error) {

      console.error("Profile error:", error);

      statusBox.textContent =
        "Unable to load your profile: " +
        error.message;

      statusBox.classList.add("error");
    }
  }


  editBtn.addEventListener("click", function () {

    editableFields.forEach(function (field) {
      document.getElementById(field).disabled = false;
    });

    editBtn.style.display = "none";
    submitBtn.style.display = "block";

    statusBox.textContent =
      "You can now edit your profile.";
  });


  form.addEventListener("submit", async function (event) {

    event.preventDefault();

    if (!loggedInUser) {
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Saving...";

    const updates = {
      full_name:
        document.getElementById("full_name").value.trim(),

      phone:
        document.getElementById("phone").value.trim(),

      address:
        document.getElementById("address").value.trim(),

      license_id:
        document.getElementById("license_id").value.trim(),

      license_expiration_date:
        document.getElementById(
          "license_expiration_date"
        ).value || null
    };

    const {
      error
    } = await supabaseClient
      .from("observers")
      .update(updates)
      .eq("auth_user_id", loggedInUser.id);

    if (error) {

      console.error("Update error:", error);

      statusBox.textContent =
        "Profile could not be updated: " +
        error.message;

      statusBox.classList.add("error");

      submitBtn.disabled = false;
      submitBtn.textContent = "Submit";

      return;
    }

    editableFields.forEach(function (field) {
      document.getElementById(field).disabled = true;
    });

    statusBox.textContent =
      "Profile updated successfully.";

    statusBox.classList.remove("error");

    submitBtn.style.display = "none";
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit";

    editBtn.style.display = "block";
  });


  loadProfile();
</script>

</body>
</html>
