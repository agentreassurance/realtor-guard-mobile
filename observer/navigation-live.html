

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realtor Guard | Live Navigation</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      background: white;
    }

    .turn-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #00843d;
      color: white;
      padding: 18px 16px;
      padding-top: max(18px, env(safe-area-inset-top));
      box-shadow: 0 3px 8px #0003;
    }

    .turn-banner .instruction {
      font-size: 23px;
      font-weight: bold;
    }

    .turn-banner .distance {
      font-size: 15px;
      margin-top: 7px;
    }

    .bottom-controls {
      position: fixed;
      bottom: 15px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .travel-info {
      background: white;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 2px 8px #0002;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #assignmentBtn {
      background: #4169e1;
      color: white;
    }

    #endBtn {
     background: #b00000;
      color: white;
      border-radius: 30px;    }

    .leaflet-top {
      top: 120px;
    }
 
/* GPS Voice Navigation Button */
#voiceBtn {
  position: fixed;
  right: 16px;
top: 270px;
  z-index: 1000;
  width: 48px;
  height: 48px;
  background: white;
  color: #333333;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 25px;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

/* Recenter GPS Button */
#recenterBtn {
  position: fixed;
  right: 16px;
  top: 340px;
  z-index: 1000;
  width: 48px;
  height: 48px;
  background: white;
  color: #4169e1;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 25px;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

/* Route Overview Button */
#routeOverviewBtn {
  position: fixed;
  right: 16px;
  top: 410px;
  z-index: 1000;
  width: 48px;
  height: 48px;
  background: white;
  color: #4169e1;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 25px;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

  
  </style>
</head>

<body>

  <div id="map"></div>

<button id="voiceBtn" type="button" aria-label="Mute navigation voice" title="Navigation voice on">🔊</button>

<button id="recenterBtn" type="button" aria-label="Recenter GPS location" title="Recenter GPS">⌖</button>


<button id="routeOverviewBtn" type="button" aria-label="Show entire route" title="Route Overview">🗺️</button>
  
  


<div class="turn-banner">
  <div style="display:flex;align-items:center;gap:16px;">
    <div id="turnArrow" style="font-size:48px;font-weight:bold;flex-shrink:0;" aria-hidden="true">↑</div>
    <div>
      <div class="instruction" id="instruction">
        Preparing navigation...
      </div>
      <div class="distance" id="turnDistance">
        Waiting for route information
      </div>
    </div>
  </div>
</div>
  

  <div class="bottom-controls">
    

   
   
 


<button id="startAssignmentBtn" type="button" 
  

style="width:100%;margin-top:10px;padding:26px 16px;min-height:84px;background:#c62828;color:white;border:0;border-radius:30px;font-size:24px;font-weight:bold;">


  Start Assignment
</button>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    "use strict";

window.navigationVoiceEnabled = true;

const voiceBtn = document.getElementById("voiceBtn");

voiceBtn.addEventListener("click", () => {
  window.navigationVoiceEnabled = !window.navigationVoiceEnabled;

  voiceBtn.textContent = window.navigationVoiceEnabled ? "🔊" : "🔇";
  voiceBtn.title = window.navigationVoiceEnabled
    ? "Navigation voice on"
    : "Navigation voice muted";
  voiceBtn.setAttribute(
    "aria-label",
    window.navigationVoiceEnabled ? "Mute navigation voice" : "Unmute navigation voice"
  );

  if (!window.navigationVoiceEnabled && "speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
});

    // Replace this placeholder with your existing Geoapify key.
    const GEOAPIFY_KEY = "ce75dfbe2c5347c3907ff060c7ca66fe";

    const params = new URLSearchParams(location.search);
    const assignmentId = params.get("assignment_id");
    const destinationLat = Number(params.get("lat"));
    const destinationLon = Number(params.get("lon"));
    
const assignmentDate = params.get("date") || "";
const assignmentTime = params.get("time") || "";


    const hasDestination =
      params.has("lat") &&
      params.has("lon") &&
      Number.isFinite(destinationLat) &&
      Number.isFinite(destinationLon) &&
      Math.abs(destinationLat) <= 90 &&
      Math.abs(destinationLon) <= 180;

    const map = L.map("map", {
      zoomControl: false
    }).setView([38.9, -77.04], 12);

document.getElementById("recenterBtn").addEventListener("click", () => {
  if (!navigator.geolocation) {
    alert("GPS location is not supported on this device.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (position) => {
      map.setView(
        [position.coords.latitude, position.coords.longitude],
        17,
        { animate: true }
      );
    },
    () => {
      alert("Unable to get GPS location. Please check location permissions.");
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

    L.control.zoom({ position: "topright" }).addTo(map);

    L.tileLayer(
  "https://maps.geoapify.com/v1/tile/positron/{z}/{x}/{y}.png?apiKey=" +
      encodeURIComponent(GEOAPIFY_KEY),
      {
        maxZoom: 20,
        attribution:
          'Powered by <a href="https://www.geoapify.com/">Geoapify</a> | &copy; OpenStreetMap contributors'
      }
    ).addTo(map);

    let routeLine = null;
    let currentMarker = null;
    let watchId = null;
    let lastRouteTime = 0;
    let routeBusy = false;
    let navigationEnded = false;

    const instruction = document.getElementById("instruction");
    const turnDistance = document.getElementById("turnDistance");
  

    function formatDistance(meters) {
      const miles = meters / 1609.344;
      return miles < 0.1
        ? Math.round(meters * 3.28084) + " ft"
        : miles.toFixed(1) + " mi";
    }

    async function updateRoute(lat, lon) {
      if (!hasDestination || routeBusy || navigationEnded) return;

      routeBusy = true;

      try {
        const url =
          "https://api.geoapify.com/v1/routing?" +
          new URLSearchParams({
            waypoints:
              lat + "," + lon + "|" +
              destinationLat + "," + destinationLon,
            mode: "drive",
            apiKey: GEOAPIFY_KEY
          });

        const response = await fetch(url);
        if (!response.ok) throw new Error("Route unavailable");

        const data = await response.json();
        if (navigationEnded) return;

        const feature = data.features?.[0];
        if (!feature) throw new Error("No driving route found");

        if (routeLine) map.removeLayer(routeLine);

        routeLine = L.geoJSON(feature, {
          style: {
            color: "#4169E1",
            weight: 8,
            opacity: 0.95
          }
        }).addTo(map);

document.getElementById("routeOverviewBtn").addEventListener("click", () => {
  if (routeLine && routeLine.getBounds().isValid()) {
    map.fitBounds(routeLine.getBounds(), {
      padding: [50, 50],
      animate: true
    });
  } else {
    alert("Open navigation from an assignment to view the route.");
  }
});

        const properties = feature.properties || {};
        const minutes = Math.ceil((properties.time || 0) / 60);

       

        const steps = properties.legs?.[0]?.steps || [];
        const nextStep = steps.find(
          step => step.instruction && step.instruction.text
        );

      
if (nextStep && window.navigationVoiceEnabled !== false && "speechSynthesis" in window) {

  const spokenInstruction = nextStep.instruction.text;

  if (window.lastSpokenInstruction !== spokenInstruction) {
    window.speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(spokenInstruction);
    voice.lang = "en-US";
    voice.rate = 0.9;
    voice.volume = 1;

    window.speechSynthesis.speak(voice);
    window.lastSpokenInstruction = spokenInstruction;
  }
}

const turnArrow = document.getElementById("turnArrow");

if (turnArrow) {
  const direction = (nextStep?.instruction?.text || "").toLowerCase();

  turnArrow.textContent =
    direction.includes("u-turn") ? "↶" :
    direction.includes("left") ? "↰" :
    direction.includes("right") ? "↱" :
    direction.includes("destination") ? "●" : "↑";
}

        instruction.textContent =
          nextStep?.instruction?.text || "↑ Follow the blue route";

        turnDistance.textContent = nextStep
          ? formatDistance(nextStep.distance || 0)
          : "Continue toward destination";

        lastRouteTime = Date.now();

      } catch (error) {
        instruction.textContent = "↑ Navigation route unavailable";
        turnDistance.textContent = "Check destination and connection";
      } finally {
        routeBusy = false;
      }
    }

    if (!navigator.geolocation) {
      instruction.textContent = "GPS is not supported";
    } else {
      watchId = navigator.geolocation.watchPosition(
        position => {
          if (navigationEnded) return;

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          if (!currentMarker) {
           
const arrowIcon = L.divIcon({
  className: "navigation-arrow",
 

html: `<div style="width:60px;height:60px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 5px #777);">

<svg width="60" height="60" viewBox="0 0 54 54">

      <path d="M27 3 L47 47 L27 37 L7 47 Z"
        fill="#4169E1" stroke="white"
        stroke-width="4" stroke-linejoin="round"/>
    </svg>
  </div>`,
  iconSize: [60, 60],
iconAnchor: [30, 30]
});

currentMarker = L.marker([lat, lon], {
  icon: arrowIcon
}).addTo(map);

            map.setView([lat, lon], 15);
          } else {
          currentMarker.setLatLng([lat, lon]);
map.panTo([lat, lon], { animate: true });
          }

          if (!hasDestination) {
            instruction.textContent = "↑ GPS location ready";
            turnDistance.textContent =
              "Open navigation from an assignment to load directions";
          
            return;
          }

          if (Date.now() - lastRouteTime > 15000) {
            lastRouteTime = Date.now();
            updateRoute(lat, lon);
          }
        },
        error => {
          instruction.textContent = "GPS location unavailable";
          turnDistance.textContent = error.message;
        },
        {
          enableHighAccuracy: true,
          maximumAge: 3000,
          timeout: 15000
        }
      );
    }

   
document.getElementById("startAssignmentBtn").addEventListener("click", () => {
window.location.href = "active-assignment-new.html" + (window.location.search || "?assignment_id=" + encodeURIComponent(sessionStorage.getItem("activeAssignmentId") || ""));
});

const startButton = document.getElementById("startAssignmentBtn");

function updateAssignmentCountdown() {
  const date = assignmentDate;
  const time = assignmentTime;

  if (!date || !time) {
    startButton.style.background = "#c62828";
    startButton.disabled = true;
    startButton.textContent = "Waiting for Assignment Time";
    return;
  }

  const scheduled = new Date(`${date}T${time}`);
  if (Number.isNaN(scheduled.getTime())) {
    startButton.style.background = "#c62828";
    startButton.disabled = true;
    startButton.textContent = "Check Assignment Time";
    return;
  }

  const remaining = scheduled.getTime() - Date.now();

if (remaining <= 0) {
  startButton.style.background = "#16803c";
  startButton.disabled = false;
  startButton.textContent = "Start Assignment";
} else if (remaining > 300000) {
  startButton.style.background = "#c62828";
  startButton.disabled = true;
  startButton.textContent = "Waiting for Assignment Time";
} else {
  const totalSeconds = Math.ceil(remaining / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  const countdown =
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0");

  startButton.style.background = "#c62828";
  startButton.disabled = true;
  startButton.textContent = "Assignment Starts in " + countdown;
}
}

updateAssignmentCountdown();
setInterval(updateAssignmentCountdown, 1000);

  </script>

</body>
</html>
