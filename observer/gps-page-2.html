
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realtor Guard | GPS Page 1</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: white;
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #f2f2f0;
    }

    .panel {
      position: fixed;
      bottom: 14px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      background: white;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 3px 18px #0002;
      max-height: 65vh;
      overflow-y: auto;
    }

    h2 {
      font-size: 19px;
      margin: 0 0 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button, .back {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 30px;
     padding: 18px;
      margin-top: 10px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    #routeBtn {
      background: #06245c;
      color: white;
    }

    #startBtn {
     background: #00843D;
      color: white;
    }

    #startBtn:disabled {
     background: #00843D;
      cursor: not-allowed;
    }

    .back {
      background: #f0f0f0;
      color: #222;
    }

    #status {
      font-size: 14px;
      margin: 10px 0;
    }

    #details {
      font-size: 14px;
      margin: 8px 0;
      font-weight: bold;
    }

    .leaflet-control-attribution {
      font-size: 10px;
    }

    @media (max-width: 600px) {
      .panel {
        bottom: 10px;
        left: 8px;
        right: 8px;
        padding: 13px;
      }
    }
  </style>
</head>

<body>


<div id="navBanner" style="position:fixed;top:0;left:0;width:100%;background:#008000;color:white;padding:16px 12px;z-index:1000;display:flex;align-items:center;gap:15px;border-radius:0 0 18px 18px;font-family:Arial,sans-serif;">
  <span style="font-size:42px;font-weight:bold;">➜</span>
  <div>
    <div id="navDirection" style="font-size:20px;font-weight:bold;">Navigation directions</div>
    <div id="navDistance" style="font-size:16px;">Preparing route...</div>
  </div>
</div>
<div id="map"></div>


  <div class="panel">
   
    

   
<input id="address" type="hidden">

     

<button id="routeBtn" style="display: none !important;">Find Driving Route</button>



    <p id="status">Waiting for your GPS location...</p>
    <p id="details"></p>

    <button id="startBtn" disabled>
   Start Assignment
    </button>

   
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Paste your Geoapify Production API key below.
    const GEOAPIFY_KEY = "be47816624ba450db8927d887bf40d5d";

    const $ = id => document.getElementById(id);

    const params = new URLSearchParams(window.location.search);

    const suppliedAddress =
      params.get("address") ||
      params.get("destination") ||
      params.get("property_address") ||
      "";

    $("address").value = suppliedAddress;

    const map = L.map("map", {
      zoomControl: true
    }).setView([37.54, -77.44], 11);

    // Confirmed Geoapify Positron map.
    L.tileLayer(
      "https://maps.geoapify.com/v1/tile/positron/{z}/{x}/{y}.png?apiKey=" +
      encodeURIComponent(GEOAPIFY_KEY),
      {
        maxZoom: 20,
        attribution:
          '&copy; OpenStreetMap contributors | Powered by Geoapify'
      }
    ).addTo(map);

    let currentPosition = null;
    let userMarker = null;
    let destinationMarker = null;
    let routeLine = null;
    let routeDestination = null;
let autoRouteStarted = false;
    function setStatus(message) {
      $("status").textContent = message;
    }

    function updatePosition(lat, lon) {
      currentPosition = [lat, lon];

      if (!userMarker) {
       
userMarker = L.marker(currentPosition, {
  icon: L.divIcon({
    className: "rg-navigation-arrow",
    html: `<div style="width:64px;height:64px;display:flex;align-items:center;justify-content:center;">
      <svg width="60" height="60" viewBox="0 0 64 64">
        <path d="M32 3 L57 57 L32 45 L7 57 Z"
          fill="#2454C6"
          stroke="white"
          stroke-width="4"
          stroke-linejoin="round"/>
      </svg>
    </div>`,
    iconSize: [64, 64],
    iconAnchor: [32, 32]
  })
}).addTo(map);


        map.setView(currentPosition, 14);
      } else {
        userMarker.setLatLng(currentPosition);
      }

      
    if (!routeLine) {
      setStatus("GPS location ready.");
      if ($("address").value.trim() && !autoRouteStarted) {
        autoRouteStarted = true;
        findDrivingRoute();
      }
    }

    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        position => {
          updatePosition(
            position.coords.latitude,
            position.coords.longitude
          );
        },
        error => {
          setStatus(
            "GPS unavailable: " + error.message +
            ". Allow location access and try again."
          );
        },
        {
          enableHighAccuracy: true,
          maximumAge: 10000,
          timeout: 20000
        }
      );
    } else {
      setStatus("GPS is not supported by this browser.");
    }

    async function geoapifyJSON(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(
          "Geoapify request failed (" + response.status + ")"
        );
      }

      return response.json();
    }

    async function findDrivingRoute() {
      const address = $("address").value.trim();

      $("startBtn").disabled = true;
      $("details").textContent = "";
      routeDestination = null;

      if (routeLine) {
        map.removeLayer(routeLine);
        routeLine = null;
      }

      if (!address) {
        setStatus("Please enter the property address.");
        return;
      }

      if (!currentPosition) {
        setStatus("Waiting for GPS. Allow location access.");
        return;
      }

      if (
        !GEOAPIFY_KEY ||
        GEOAPIFY_KEY === "PASTE_YOUR_GEOAPIFY_KEY_HERE"
      ) {
        setStatus("Geoapify API key must be added first.");
        return;
      }

      $("routeBtn").disabled = true;
      setStatus("Finding property and calculating route...");

      try {
        const geocodeURL =
          "https://api.geoapify.com/v1/geocode/search?text=" +
          encodeURIComponent(address) +
          "&limit=1&apiKey=" +
          encodeURIComponent(GEOAPIFY_KEY);

        const locationData = await geoapifyJSON(geocodeURL);
        const feature = locationData.features?.[0];

        if (!feature) {
          throw new Error("Property address not found.");
        }

        const lon = feature.geometry.coordinates[0];
        const lat = feature.geometry.coordinates[1];

        routeDestination = [lat, lon];

        if (destinationMarker) {
          map.removeLayer(destinationMarker);
        }

        destinationMarker = L.marker(
          routeDestination
        ).addTo(map);

        const waypoints =
          currentPosition[0] + "," + currentPosition[1] +
          "|" + lat + "," + lon;

        const routingURL =
          "https://api.geoapify.com/v1/routing?waypoints=" +
          encodeURIComponent(waypoints) +
          "&mode=drive&apiKey=" +
          encodeURIComponent(GEOAPIFY_KEY);

        const routeData = await geoapifyJSON(routingURL);
        const route = routeData.features?.[0];

        if (!route) {
          throw new Error("No driving route was found.");
        }

        routeLine = L.geoJSON(route, {
          style: {
            color: "#123fba",
            weight: 7,
            opacity: 0.95
          }
        }).addTo(map);

        map.fitBounds(routeLine.getBounds(), {
          padding: [40, 40],
          maxZoom: 16
        });

        const distance =
          route.properties?.distance || 0;

        const time =
          route.properties?.time || 0;

        const miles = (distance / 1609.344).toFixed(1);
        const minutes = Math.ceil(time / 60);

        $("details").textContent =
          miles + " miles | About " + minutes + " minutes";

        setStatus("Driving route ready.");
        $("startBtn").disabled = false;

const steps = route.properties?.legs?.[0]?.steps || [];
const firstStep = steps.find(step => step.instruction?.text);

if (firstStep) {
  $("navDirection").textContent = firstStep.instruction.text;
  $("navDistance").textContent =
    Math.round(firstStep.distance || 0) + " meters";
}

      } catch (error) {
        setStatus(error.message);
        $("startBtn").disabled = true;
      } finally {
        $("routeBtn").disabled = false;
      }
    }

    $("routeBtn").addEventListener(
      "click",
      findDrivingRoute
    );

    $("startBtn").addEventListener("click", () => {
      if (!routeDestination) return;

      const next = new URL(
      "active-assignment-new.html",
        window.location.href
      );

      next.searchParams.set(
        "address",
        $("address").value.trim()
      );

      next.searchParams.set(
        "lat",
        String(routeDestination[0])
      );

      next.searchParams.set(
        "lon",
        String(routeDestination[1])
      );

const assignmentId =
  new URLSearchParams(window.location.search).get("assignment_id") ||
  sessionStorage.getItem("activeAssignmentId");

if (assignmentId) {
  next.searchParams.set("assignment_id", assignmentId);
}

      window.location.href = next.href;
    });
  
function showDriveDetails() {
  const details = document.getElementById("details");
  const address = document.getElementById("address").value.trim();

  if (!details) return;

  if (!address) {
    details.textContent =
      "🚗 Drive: Enter the property address to view driving directions.";
    return;
  }

  details.textContent =
    "🚗 Driving to: " + address +
    " | " + (routeDestination
      ? "Driving route information is shown after the route is calculated."
      : "Waiting for driving route information.");
}

  </script>
</body>
</html>
