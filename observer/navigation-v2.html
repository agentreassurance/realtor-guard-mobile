
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realtor Guard | GPS Navigation</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root { --red:#b90000; --dark:#990000; }
* { box-sizing:border-box; }
body { margin:0; background:#fff; font-family:Arial,sans-serif; color:#202020; }
main { max-width:480px; margin:auto; padding:15px; }
header { display:flex; align-items:center; justify-content:space-between; min-height:55px; }
.logo { max-width:185px; max-height:60px; object-fit:contain; }
.menu { background:white; border:0; color:var(--dark); font-size:30px; cursor:pointer; }
h1 { color:var(--dark); font-size:29px; margin:16px 0 5px; }
.subtitle { color:#626c7a; margin:0 0 17px; }
#map { width:100%; height:440px; background:white; border:1px solid #efd3d3; border-radius:17px; overflow:hidden; }
.status { font-size:13px; color:#626c7a; margin:12px 0; }
.card { border:1px solid #e5e5e5; border-radius:16px; padding:17px; margin:13px 0; background:white; }
.info { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
h2 { color:var(--dark); font-size:18px; margin:0 0 10px; }
.value { font-size:15px; overflow-wrap:anywhere; }
button.action, a.action { display:block; width:100%; text-align:center; font-size:16px; font-weight:bold; padding:17px 12px; border-radius:14px; cursor:pointer; text-decoration:none; margin-top:13px; }
.primary { background:var(--red); color:white; border:2px solid var(--red); }
.secondary { background:white; color:var(--dark); border:2px solid var(--red); }
#directions { padding-left:23px; line-height:1.65; font-size:14px; }
#directions li { margin-bottom:8px; }
.maplibregl-ctrl-group button { color:var(--dark); }
.gps-dot { width:23px; height:23px; border-radius:50%; background:#0866df; border:4px solid white; box-shadow:0 0 0 3px #0866df,0 2px 8px #555; }
.destination { font-size:34px; line-height:1; filter:drop-shadow(0 2px 2px #777); }
</style>
</head>
<body>
<main>
<header>
<img class="logo" src="../logo.png" alt="Realtor Guard">
<button class="menu" type="button" aria-label="Return to My Assignments" onclick="location.href='my-assignments.html'">☰</button>
</header>

<h1>GPS Navigation</h1>
<p class="subtitle">Follow the route to the property location.</p>

<div id="map" aria-label="Interactive GPS map"></div>
<p id="status" class="status">Preparing GPS navigation…</p>

<section class="card info">
<div>
<h2>Property Address</h2>
<div class="value" id="address">No property selected</div>
</div>
<div>
<h2>Estimated Drive Time</h2>
<div class="value" id="eta">—</div>
<div class="status" id="distance">—</div>
</div>
</section>

<button class="action primary" id="routeBtn" type="button">🚗 Get Driving Route</button>

<section class="card">
<h2>Driving Directions</h2>
<ol id="directions">
<li>Select Get Driving Route to begin.</li>
</ol>
</section>

<a class="action secondary" href="my-assignments.html">Return to My Assignments</a>
</main>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const params = new URLSearchParams(location.search);
const addressParts = [
  params.get("address"),
  params.get("city"),
  params.get("state"),
  params.get("zip")
].filter(Boolean);
const propertyAddress = addressParts.join(", ");
const statusEl = document.getElementById("status");
const addressEl = document.getElementById("address");
const etaEl = document.getElementById("eta");
const distanceEl = document.getElementById("distance");
const directionsEl = document.getElementById("directions");

if (propertyAddress) addressEl.textContent = propertyAddress;

let currentPosition = null;
let destination = null;
let gpsMarker = null;
let destinationMarker = null;

const map = new maplibregl.Map({
  container:"map",
  style:"https://tiles.openfreemap.org/styles/liberty",
  center:[-77.436,37.541],
  zoom:11,
  attributionControl:true
});
map.addControl(new maplibregl.NavigationControl(),"top-left");

function setStatus(message) {
  statusEl.textContent = message;
}

function styleRoads() {
  const style = map.getStyle();
  if (!style || !style.layers) return;
  for (const layer of style.layers) {
    const id = layer.id.toLowerCase();
    if (layer.type === "background") {
      map.setPaintProperty(layer.id,"background-color","#ffffff");
    }
    if (layer.type === "fill" && /landcover|landuse|park|grass|wood|building/.test(id)) {
      map.setPaintProperty(layer.id,"fill-color","#ffffff");
      map.setPaintProperty(layer.id,"fill-opacity",0.85);
    }
    if (layer.type === "line" && /road|street|highway|motorway|trunk|primary|secondary|tertiary/.test(id) && !/rail|path|pedestrian/.test(id)) {
    map.setPaintProperty(layer.id,"line-color","#990000");
    }
  }
}

map.on("load",() => {
  try { styleRoads(); } catch(e) { console.warn("Map styling:",e); }
  setStatus("Map ready. Select Get Driving Route.");
  if (propertyAddress) locateDestination();
});

function showGPS(lon,lat) {
  currentPosition = [lon,lat];
  if (!gpsMarker) {
    const dot = document.createElement("div");
    dot.className = "gps-dot";
    gpsMarker = new maplibregl.Marker({element:dot})
      .setLngLat(currentPosition).addTo(map);
  } else {
    gpsMarker.setLngLat(currentPosition);
  }
}

function getGPS() {
  return new Promise((resolve,reject) => {
    if (!navigator.geolocation) {
      reject(new Error("GPS is not supported on this device."));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      position => {
        const lon = position.coords.longitude;
        const lat = position.coords.latitude;
        showGPS(lon,lat);
        resolve([lon,lat]);
      },
      error => reject(new Error("Location unavailable. Allow location access in your browser and try again.")),
      {enableHighAccuracy:true,timeout:20000,maximumAge:10000}
    );
  });
}

async function locateDestination() {
  if (!propertyAddress) return;
  setStatus("Finding the property address…");
  try {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q="
      + encodeURIComponent(propertyAddress);
    const response = await fetch(url);
    if (!response.ok) throw new Error("Address lookup unavailable.");
    const results = await response.json();
    if (!results.length) throw new Error("Property address not found. Check the assignment address.");
    destination = [Number(results[0].lon),Number(results[0].lat)];

    if (destinationMarker) destinationMarker.remove();
    const pin = document.createElement("div");
    pin.className = "destination";
    pin.textContent = "📍";
    destinationMarker = new maplibregl.Marker({element:pin,anchor:"bottom"})
      .setLngLat(destination)
      .setPopup(new maplibregl.Popup().setText(propertyAddress))
      .addTo(map);
    map.flyTo({center:destination,zoom:13});
    setStatus("Property located. Select Get Driving Route.");
  } catch(error) {
    setStatus(error.message);
  }
}

function displayRoute(coordinates) {
  const data = {
    type:"Feature",
    geometry:{type:"LineString",coordinates},
    properties:{}
  };
  if (map.getSource("driving-route")) {
    map.getSource("driving-route").setData(data);
  } else {
    map.addSource("driving-route",{type:"geojson",data});
    map.addLayer({
      id:"driving-route-outline",
      type:"line",
      source:"driving-route",
      layout:{"line-join":"round","line-cap":"round"},
      paint:{"line-color":"#ffffff","line-width":13}
    });
    map.addLayer({
      id:"driving-route-line",
      type:"line",
      source:"driving-route",
      layout:{"line-join":"round","line-cap":"round"},
      paint:{"line-color":"#a90000","line-width":9}
    });
  }
  const bounds = coordinates.reduce(
    (b,point) => b.extend(point),
    new maplibregl.LngLatBounds(coordinates[0],coordinates[0])
  );
  map.fitBounds(bounds,{padding:55,maxZoom:15});
}

function readableInstruction(step) {
  const maneuver = step.maneuver || {};
  const road = step.name ? " onto " + step.name : "";
  const type = maneuver.type || "continue";
  const modifier = maneuver.modifier || "";
  if (type === "arrive") return "You have arrived at the property.";
  if (type === "depart") return "Depart" + road + ".";
  if (type === "turn") return "Turn " + modifier + road + ".";
  if (type === "roundabout") return "Enter the roundabout" + road + ".";
  if (type === "merge") return "Merge " + modifier + road + ".";
  if (type === "on ramp") return "Take the ramp" + road + ".";
  if (type === "off ramp") return "Take the exit" + road + ".";
  return "Continue" + road + ".";
}

async function getDrivingRoute() {
  const button = document.getElementById("routeBtn");
  button.disabled = true;
  try {
    if (!propertyAddress) throw new Error("Open Navigation from an assignment to load its property address.");
    if (!destination) await locateDestination();
    if (!destination) throw new Error("Could not locate the property address.");

    setStatus("Getting your current GPS location…");
    const start = await getGPS();
    setStatus("Calculating driving directions…");

    const routeUrl = "https://router.project-osrm.org/route/v1/driving/"
      + start.join(",") + ";" + destination.join(",")
      + "?overview=full&geometries=geojson&steps=true";

    const response = await fetch(routeUrl);
    if (!response.ok) throw new Error("Driving route service unavailable.");
    const result = await response.json();
    if (result.code !== "Ok" || !result.routes?.length) {
      throw new Error("No driving route found.");
    }

    const route = result.routes[0];
    displayRoute(route.geometry.coordinates);

    const minutes = Math.max(1,Math.round(route.duration/60));
    const miles = route.distance/1609.344;
    etaEl.textContent = minutes + " min";
    distanceEl.textContent = miles.toFixed(1) + " miles";

    directionsEl.replaceChildren();
    for (const leg of route.legs) {
      for (const step of leg.steps) {
        const li = document.createElement("li");
        li.textContent = readableInstruction(step);
        directionsEl.appendChild(li);
      }
    }
    setStatus("Driving route ready. Follow traffic laws and road signs.");
  } catch(error) {
    setStatus(error.message);
  } finally {
    button.disabled = false;
  }
}

document.getElementById("routeBtn").addEventListener("click",getDrivingRoute);
</script>
</body>
</html>
