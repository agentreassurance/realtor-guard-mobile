
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realtor Guard | GPS Navigation</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>

:root {
  --red: #b00000;
  --dark: #780000;
  --pale: #fff1f1;
}
/* GPS map background */
#map {
  background-color: #FFFFFF;
}

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: white;
      color: #202020;
      font-family: Arial, sans-serif;
    }

    main {
     max-width: 100%;
      margin: auto;
     padding: 0;
    }

    header {
      position: relative;
      text-align: center;
      min-height: 105px;
    }

    .logo {
      max-width: 250px;
      max-height: 135px;
      object-fit: contain;
    }

    .menu {
      position: absolute;
      right: 0;
      top: 8px;
      background: white;
      border: 0;
      color: var(--dark);
      font-size: 30px;
      cursor: pointer;
    }

    h1 {
      color: var(--dark);
      font-size: 29px;
      margin: 15px 0 5px;
    }

    .subtitle, #status {
      color: #626c7a;
      font-size: 14px;
      line-height: 1.5;
    }

    #map {
      width: 100%;
     height: 100vh;
      border: 1px solid #efd3d3;
      border-radius: 17px;
      overflow: hidden;
      background: var(--pale);
      margin: 16px 0;
    }

    .card {
      background: white;
      border: 1px solid #ead3d3;
      border-radius: 14px;
      padding: 15px;
      margin: 13px 0;
    }

    .label {
      color: var(--dark);
      font-weight: bold;
      margin-bottom: 7px;
    }

    .value {
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px 12px;
      margin: 13px 0;
      border-radius: 12px;
      border: 2px solid var(--red);
      background: var(--red);
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .outline {
      background: white;
      color: var(--dark);
    }

    .directions {
      padding-left: 22px;
      line-height: 1.6;
    }

    .directions li {
      margin-bottom: 10px;
    }

    .gps-marker {
      background: #1674e8;
      border: 3px solid white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      box-shadow: 0 0 0 3px #1674e855;
    }

    .destination-marker {
      background: var(--red);
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      text-align: center;
      line-height: 26px;
      font-weight: bold;
      box-shadow: 0 2px 8px #0004;
    }

    .leaflet-control-attribution {
      font-size: 10px;
    }



  </style>
</head>

<body>
<main>
 <header style="display:none">
    <img src="../logo.png"
      alt="Realtor Guard" class="logo">
    <button class="menu"
      onclick="window.location.href='my-assignments.html'"
      aria-label="Return to assignments">&#9776;</button>
  </header>

 <h1 style="display:none">GPS Navigation</h1>
<p class="subtitle" style="display:none">
   
  </p>

 <p id="status" role="status" style="display:none">
    Preparing GPS navigation...
  </p>

  <div id="map" aria-label="Interactive GPS map"></div>


<div id="gps-controls" style="position:fixed;right:15px;top:20%;z-index:1000;display:none;flex-direction:column;gap:12px;">


  <button type="button" aria-label="Search" title="Search"
    style="width:52px;height:52px;border:0;border-radius:50%;background:black;color:white;font-size:30px;font-weight:bold;cursor:pointer;">
    &#9906;
  </button>

  <button type="button" aria-label="Volume" title="Volume"
    style="width:52px;height:52px;border:0;border-radius:50%;background:black;color:white;font-size:28px;cursor:pointer;">
    &#128266;
  </button>

  <button type="button" aria-label="My GPS Location" title="My GPS Location"
    style="width:52px;height:52px;border:0;border-radius:50%;background:black;color:white;font-size:30px;font-weight:bold;cursor:pointer;">
    &#8857;
  </button>

</div>




<div class="card" style="display:block;position:fixed;bottom:160px;left:10px;right:10px;z-index:1000;background:#ffffff;color:#000000;border-radius:12px;padding:12px;">



    <div class="label" style="color:#000000;font-weight:800;font-size:18px;">Property Address</div>
   <div class="value" id="address" style="color:#000000;font-weight:700;font-size:16px;">
      Loading assignment address...
    </div>
  </div>



<div class="card" style="display:block;position:fixed;bottom:90px;left:10px;right:10px;z-index:1000;background:#ffffff;color:#000000;">


   <div class="label" style="color:#000000;font-weight:800;font-size:18px;">Estimated Travel</div>
  
<div id="travelModes" style="display:flex;justify-content:space-around;gap:6px;margin:10px 0;">
 
<button type="button" onclick="toggleTravelMode('drive')" style="flex:1;border:0;border-radius:9px;padding:8px 2px;background:#e5f3ea;color:#000;">
  <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
    <path d="M5 11 6.5 6.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11h1a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1v1a1 1 0 0 1-2 0v-1H7v1a1 1 0 0 1-2 0v-1H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h1Zm3.4-4L7.2 11h9.6l-1.2-4H8.4ZM7 14a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/>
  </svg>
  <div style="font-weight:800;font-size:14px;">Drive</div>
</button>

<button type="button" onclick="toggleTravelMode('transit')" style="flex:1;border:0;border-radius:9px;padding:8px 2px;background:#f2f2f2;color:#000;">
  <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
    <path d="M5 3h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2v2h-3v-2H8v2H5v-2a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm1 3v7h12V6H6Zm1 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/>
  </svg>
  <div style="font-weight:800;font-size:14px;">Transit</div>
</button>

<button type="button" onclick="toggleTravelMode('walk')" style="flex:1;border:0;border-radius:9px;padding:8px 2px;background:#f2f2f2;color:#000;">
  <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
    <circle cx="13" cy="3.5" r="2.5"/>
    <path d="M10 7h4l3 4 3 1-1 2-4-1-2-2-1 4 3 3 1 4h-3l-1-3-3-2-2 5H4l3-8 2-4-2 2-3 1-1-2 4-2 3-2Z"/>
  </svg>
  <div style="font-weight:800;font-size:14px;">Walk</div>
</button>

<button type="button" onclick="toggleTravelMode('bike')" style="flex:1;border:0;border-radius:9px;padding:8px 2px;background:#f2f2f2;color:#000;">
  <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="5" cy="17" r="4"/>
    <circle cx="19" cy="17" r="4"/>
    <path d="M5 17 9 9l5 8h5l-4-10h-3M9 9h4M9 6h3"/>
  </svg>
  <div style="font-weight:800;font-size:14px;">Bike</div>
</button>

</div>
<div id="travelModeDetails" style="display:none;padding:10px;border-radius:9px;background:#f7f7f7;color:#000;font-size:13px;"></div>

  <div class="value" id="eta" style="color:#000000;font-weight:700;font-size:16px;">
      Waiting for driving route...
    </div>
   <div class="value" id="distance" style="color:#000000;font-weight:700;font-size:16px;"></div>
  </div>




<button class="button" id="routeButton" style="display:block;position:fixed;bottom:10px;left:10px;right:10px;width:calc(100% - 20px);z-index:1001;background:#00843D;color:white;border:0;border-radius:50px;font-weight:bold;padding:18px;cursor:pointer;">
Start Navigation
</button>


  <button class="button outline" id="locationButton" style="display:none">
    Refresh My GPS Location
  </button>

  <div class="card" style="display:none">
    <div class="label">Driving Directions</div>
    <ol class="directions" id="directions">
      <li>Your directions will appear here.</li>
    </ol>
  </div>

 <a class="button outline" href="my-assignments.html" style="display:none">
    Return to My Assignments
  </a>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
"use strict";

/*
  GEOAPIFY SETUP

  Replace the placeholder below with your existing
  Geoapify API key directly inside GitHub.

  Keep your HTTP Origin restriction enabled.
*/

const GEOAPIFY_KEY = "ce75dfbe2c5347c3907ff060c7ca66fe";

const params = new URLSearchParams(window.location.search);

const propertyAddress = [
  params.get("address"),
  params.get("city"),
  params.get("state"),
  params.get("zip")
].filter(Boolean).join(", ");

const addressEl = document.getElementById("address");
const statusEl = document.getElementById("status");
const etaEl = document.getElementById("eta");
const distanceEl = document.getElementById("distance");
const directionsEl = document.getElementById("directions");
const routeButton = document.getElementById("routeButton");
const locationButton = document.getElementById("locationButton");

let map;
let gpsMarker = null;
let destinationMarker = null;
let routeLine = null;
let currentPosition = null;
let destination = null;

function setStatus(message) {
  statusEl.textContent = message;
}

function checkKey() {
  if (!GEOAPIFY_KEY ||
      GEOAPIFY_KEY === "PASTE_YOUR_GEOAPIFY_KEY_HERE") {
    setStatus("Geoapify API key must be configured.");
    return false;
  }
  return true;
}

function initializeMap() {
  map = L.map("map", {
    zoomControl: false
  }).setView([38.9, -77.04], 11);

  L.control.zoom({
    position: "topright"
  }).addTo(map);

  L.tileLayer(


"https://maps.geoapify.com/v1/tile/osm-bright/{z}/{x}/{y}.png?apiKey=" +


    encodeURIComponent(GEOAPIFY_KEY),
    {
      attribution:
        'Powered by <a href="https://www.geoapify.com/">Geoapify</a> | ' +
        '&copy; OpenStreetMap contributors',
      maxZoom: 20
    }
  ).addTo(map);
}

function makeMarker(type) {
  const className = type === "gps"
    ? "gps-marker"
    : "destination-marker";

  return L.divIcon({
    className: "",
    html: '<div class="' + className + '">' +
      (type === "gps" ? "" : "&#9679;") +
      "</div>",
    iconSize: type === "gps" ? [18, 18] : [30, 30],
    iconAnchor: type === "gps" ? [9, 9] : [15, 15]
  });
}

function getGPS() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("GPS is not supported by this device."));
      return;
    }

    setStatus("Finding your current GPS location...");

    navigator.geolocation.getCurrentPosition(
      position => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        currentPosition = [lat, lon];

        if (gpsMarker) {
          gpsMarker.setLatLng(currentPosition);
        } else {
          gpsMarker = L.marker(currentPosition, {
            icon: makeMarker("gps")
          }).addTo(map);
          gpsMarker.bindPopup("Your current location");
        }

        map.setView(currentPosition, 15);
        setStatus("GPS location found.");
        resolve(currentPosition);
      },
      error => {
        let message = "Unable to retrieve GPS location.";

        if (error.code === 1) {
          message = "Please allow location access in your browser.";
        } else if (error.code === 2) {
          message = "GPS location is currently unavailable.";
        } else if (error.code === 3) {
          message = "GPS location request timed out.";
        }

        setStatus(message);
        reject(new Error(message));
      },
      {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      }
    );
  });
}

async function locateDestination() {
  if (!propertyAddress) {
    throw new Error(
      "No property address was provided by the assignment."
    );
  }

  setStatus("Finding the assigned property...");

  const url =
    "https://api.geoapify.com/v1/geocode/search?text=" +
    encodeURIComponent(propertyAddress) +
    "&limit=1&apiKey=" +
    encodeURIComponent(GEOAPIFY_KEY);

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Property address lookup failed.");
  }

  const data = await response.json();

  if (!data.features || !data.features.length) {
    throw new Error("Property address could not be located.");
  }

  const coordinates = data.features[0].geometry.coordinates;

  destination = [
    coordinates[1],
    coordinates[0]
  ];

  if (destinationMarker) {
    destinationMarker.setLatLng(destination);
  } else {
    destinationMarker = L.marker(destination, {
      icon: makeMarker("destination")
    }).addTo(map);
  }

  destinationMarker.bindPopup(propertyAddress);

  if (currentPosition) {
    map.fitBounds(
      L.latLngBounds([currentPosition, destination]),
      { padding: [40, 40] }
    );
  } else {
    map.setView(destination, 14);
  }

  setStatus("Property located. Ready for driving directions.");
  return destination;
}

function formatDistance(meters) {
  const miles = meters / 1609.344;
  return miles.toFixed(1) + " miles";
}

function formatDuration(seconds) {
  const minutes = Math.ceil(seconds / 60);

  if (minutes < 60) {
    return minutes + " minutes";
  }

  const hours = Math.floor(minutes / 60);
  const remaining = minutes % 60;

  return hours + " hr" +
    (remaining ? " " + remaining + " min" : "");
}

function showRoute(geometry) {
  if (routeLine) {
    map.removeLayer(routeLine);
    routeLine = null;
  }

  routeLine = L.geoJSON(geometry, {
    style: {
      color: "#a90000",
      weight: 7,
      opacity: 0.95
    }
  }).addTo(map);

  map.fitBounds(routeLine.getBounds(), {
    padding: [35, 35]
  });
}

function showDirections(properties) {
  directionsEl.replaceChildren();

  const legs = properties.legs || [];

  const steps = legs.flatMap(leg => leg.steps || []);

  if (!steps.length) {
    const li = document.createElement("li");
    li.textContent =
      "Follow the highlighted route to the destination.";
    directionsEl.appendChild(li);
    return;
  }

  steps.forEach(step => {
    const li = document.createElement("li");

    const instruction = step.instruction?.text ||
      step.instruction ||
      step.name ||
      "Continue along the route";

    const message = typeof instruction === "string"
      ? instruction
      : "Continue along the route";

    li.textContent = message;

    if (typeof step.distance === "number" &&
        step.distance > 0) {
      li.textContent +=
        " (" + formatDistance(step.distance) + ")";
    }

    directionsEl.appendChild(li);
  });
}

async function getDrivingRoute() {
  if (!checkKey()) return;

  routeButton.disabled = true;

  try {
    if (!currentPosition) {
      await getGPS();
    }

    if (!destination) {
      await locateDestination();
    }

    setStatus("Calculating your driving route...");

    const waypoints =
      currentPosition[0] + "," + currentPosition[1] +
      "|" +
      destination[0] + "," + destination[1];

    const url =
      "https://api.geoapify.com/v1/routing?waypoints=" +
      encodeURIComponent(waypoints) +
      "&mode=drive&details=instruction_details" +
      "&apiKey=" +
      encodeURIComponent(GEOAPIFY_KEY);

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(
        "Driving route request failed. Please try again."
      );
    }

    const data = await response.json();

    if (!data.features || !data.features.length) {
      throw new Error("No driving route was found.");
    }

    const route = data.features[0];
    const properties = route.properties || {};

    showRoute(route.geometry);

    if (typeof properties.time === "number") {
      etaEl.textContent = formatDuration(properties.time);
    } else {
      etaEl.textContent = "ETA unavailable";
    }

    if (typeof properties.distance === "number") {
      distanceEl.textContent =
        "Driving distance: " +
        formatDistance(properties.distance);
    }

    showDirections(properties);

    setStatus("Driving route ready. Follow the directions.");
const liveNavigationURL = new URL("navigation-live.html", window.location.href);
liveNavigationURL.search = window.location.search;
window.location.href = liveNavigationURL.href;
  } catch (error) {
    setStatus(error.message);
  } finally {
    routeButton.disabled = false;
  }
}

async function refreshLocation() {
  locationButton.disabled = true;

  try {
    await getGPS();

    if (destination) {
      map.fitBounds(
        L.latLngBounds([currentPosition, destination]),
        { padding: [40, 40] }
      );
    }
  } catch (error) {
    setStatus(error.message);
  } finally {
    locationButton.disabled = false;
  }
}

routeButton.addEventListener("click", getDrivingRoute);
locationButton.addEventListener("click", refreshLocation);

async function startNavigation() {
  addressEl.textContent =
    propertyAddress || "No assignment address supplied.";

  if (!checkKey()) return;

  initializeMap();

  try {
    await locateDestination();
  } catch (error) {
    setStatus(error.message);
  }

  try {
    await getGPS();
  } catch (error) {
    setStatus(error.message);
  }

  if (destination && currentPosition) {
    map.fitBounds(
      L.latLngBounds([currentPosition, destination]),
      { padding: [40, 40] }
    );

    setStatus("Ready. Select Get Driving Route.");
  }
}
function toggleTravelMode(mode) {
  const details = document.getElementById("travelModeDetails");

  if (!details) return;

  const labels = {
    drive: "🚗 Driving",
    transit: "🚌 Public Transportation",
    walk: "🚶 Walking",
    bike: "🚲 Bicycling"
  };

  if (details.style.display === "block" &&
      details.dataset.mode === mode) {
    details.style.display = "none";
    return;
  }

  details.dataset.mode = mode;
  details.style.display = "block";

  if (mode === "drive") {
    const eta = document.getElementById("eta")?.textContent || "";
    const distance = document.getElementById("distance")?.textContent || "";

    details.textContent = `${labels[mode]} — ${eta} ${distance}`;
  } else {
    details.textContent =
      `${labels[mode]} — Travel time not yet available.`;
  }
}
startNavigation();
</script>
</body>
</html>
