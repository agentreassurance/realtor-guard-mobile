<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Create New Password | Realtor Guard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .reset-container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 150px;
      max-width: 45%;
      margin-bottom: 35px;
    }

    h1 {
      color: #c92026;
      margin-bottom: 30px;
      font-size: 34px;
    }

    .password-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 18px;
    }

    .password-wrapper input {
      width: 100%;
      padding: 17px 50px 17px 16px;
      font-size: 18px;
      border: 1px solid #999;
      border-radius: 8px;
    }

    .eye-button {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
    }

    .save-button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 8px;
      background: #c92026;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .save-button:hover {
      background: #a9161c;
    }

    #message {
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="reset-container">

    <img
      src="../logo.png"
      alt="Realtor Guard"
      class="logo"
    >

    <h1>Create New Password</h1>

    <div class="password-wrapper">
      <input
        id="newPassword"
        type="password"
        placeholder="New Password"
        autocomplete="new-password"
      >
      <button
        type="button"
        class="eye-button"
        onclick="togglePassword('newPassword')"
        aria-label="Show or hide password"
      >
        👁️
      </button>
    </div>

    <div class="password-wrapper">
      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm New Password"
        autocomplete="new-password"
      >
      <button
        type="button"
        class="eye-button"
        onclick="togglePassword('confirmPassword')"
        aria-label="Show or hide password"
      >
        👁️
      </button>
    </div>

    <button
      type="button"
      class="save-button"
      onclick="saveNewPassword()"
    >
      Save New Password
    </button>

    <div id="message"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://ujnvhlleqfqjgnkcjlrc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_9q5KNgJ4lLvWqqn0IdIlBw_KIAWNxgR";

    const supabaseClient =
      supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let recoveryReady = false;

    async function prepareRecoverySession() {
      const message = document.getElementById("message");

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (session) {
        recoveryReady = true;
        return;
      }

      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);

      const accessToken = params.get("access_token");
      const refreshToken = params.get("refresh_token");

      if (accessToken && refreshToken) {
        const { error } = await supabaseClient.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

        if (!error) {
          recoveryReady = true;
          return;
        }
      }

      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" || session) {
          recoveryReady = true;
        }
      });

      setTimeout(() => {
        if (!recoveryReady) {
          message.style.color = "red";
          message.textContent =
            "Password reset session is not ready. Please use a fresh reset link.";
        }
      }, 3000);
    }

    prepareRecoverySession();

    async function saveNewPassword() {
      const newPassword =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const message =
        document.getElementById("message");

      message.textContent = "";

      if (!newPassword || !confirmPassword) {
        message.style.color = "red";
        message.textContent =
          "Please enter and confirm your new password.";
        return;
      }

      if (newPassword.length < 6) {
        message.style.color = "red";
        message.textContent =
          "Password must be at least 6 characters.";
        return;
      }

      if (newPassword !== confirmPassword) {
        message.style.color = "red";
        message.textContent =
          "Passwords do not match.";
        return;
      }

      if (!recoveryReady) {
        message.style.color = "red";
        message.textContent =
          "Password reset session is not ready. Please use a fresh reset link.";
        return;
      }

      const { error } =
        await supabaseClient.auth.updateUser({
          password: newPassword
        });

      if (error) {
        message.style.color = "red";
        message.textContent =
          "Unable to update password: " + error.message;
        return;
      }

      message.style.color = "green";
      message.textContent =
        "Password successfully changed. Returning to login...";

      setTimeout(() => {
        window.location.href = "login.html?reset=success";
      }, 2000);
    }

    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);

      if (field.type === "password") {
        field.type = "text";
      } else {
        field.type = "password";
      }
    }
  </script>

</body>
</html>
