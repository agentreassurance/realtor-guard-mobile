<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Observer Dashboard | Realtor Guard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f4f4;
      color: #222222;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: #ffffff;
    }

    .header {
      padding: 20px 18px;
      background: #b00000;
      color: #ffffff;
      text-align: center;
    }

    .logo {
      display: block;
      width: 105px;
      margin: 0 auto 10px;
      padding: 6px;
      border-radius: 8px;
      background: #ffffff;
    }

    .header h1 {
      margin: 0;
      font-size: 27px;
    }

    .header p {
      margin: 8px 0 0;
      line-height: 1.4;
    }

    .content {
      padding: 18px;
    }

    .profile-card,
    .assignment-card {
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid #dddddd;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .profile-top {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .profile-photo {
      width: 72px;
      height: 72px;
      border: 3px solid #b00000;
      border-radius: 50%;
      background: #eeeeee;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 34px;
    }

    .profile-info {
      flex: 1;
    }

    .profile-info h2 {
      margin: 0 0 5px;
      color: #b00000;
      font-size: 21px;
    }

    .rating {
      margin: 0 0 7px;
      color: #b06b00;
      font-weight: bold;
    }

    .verified {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #e9f8ec;
      color: #16702b;
      font-size: 13px;
      font-weight: bold;
    }

    .status-row {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #eeeeee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-label {
      font-weight: bold;
    }

    .status-button {
      min-width: 112px;
      min-height: 42px;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #168437;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .section-heading {
      margin: 6px 0 14px;
      color: #b00000;
      font-size: 23px;
      text-align: center;
    }

    .assignment-card h3 {
      margin: 0 0 14px;
      color: #b00000;
      font-size: 21px;
      text-align: center;
    }

    .detail {
      margin: 10px 0;
      line-height: 1.4;
    }

    .detail strong {
      color: #111111;
    }

    .pay-box {
      margin: 16px 0;
      padding: 13px;
      border: 1px solid #b8dfc0;
      border-radius: 9px;
      background: #effaf1;
      color: #087322;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
    }

    .privacy-note {
      margin: -5px 0 16px;
      color: #666666;
      font-size: 13px;
      text-align: center;
    }

    .accept-button,
    .refresh-button,
    .logout-button {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .accept-button {
      background: #b00000;
      color: #ffffff;
    }

    .refresh-button {
      margin-top: 4px;
      background: #333333;
      color: #ffffff;
    }

    .logout-button {
      margin-top: 11px;
      border: 1px solid #b00000;
      background: #ffffff;
      color: #b00000;
    }

    .notice {
      margin-top: 16px;
      padding: 13px;
      border-radius: 9px;
      background: #f2f2f2;
      color: #444444;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <main class="page">
    <header class="header">
      <img
        class="logo"
        src="../logo.png"
        alt="Realtor Guard logo"
      >

      <h1>Observer Dashboard</h1>

      <p>
        View available assignments and provide safety support to agents.
      </p>
    </header>

    <section class="content">
      <div class="profile-card">
        <div class="profile-top">
          <div class="profile-photo" aria-label="Observer profile photo">
            👤
          </div>

          <div class="profile-info">
            <h2>Welcome, Observer</h2>

            <p class="rating">
              ★★★★★ New Observer
            </p>

            <span class="verified">
              ✓ Identity Verified
            </span>
          </div>
        </div>

        <div class="status-row">
          <span class="status-label">
            Availability Status
          </span>

          <button
            id="statusButton"
            class="status-button"
            type="button"
            onclick="toggleStatus()"
          >
            Available
          </button>
        </div>
      </div>

      <h2 class="section-heading">
        Available Assignments
      </h2>

    <div id="assignmentsContainer"></div>
      <button
        class="refresh-button"
        type="button"
        onclick="window.location.reload()"
      >
        Refresh Assignments
      </button>

      <button
        class="logout-button"
        type="button"
        onclick="window.location.href='login.html'"
      >
        Log Out
      </button>

      <div class="notice">
        Property address and agent contact details become available after
        the assignment has been accepted.
      </div>
    </section>
  </main>
<script>
  const SUPABASE_URL = "https://ujnvhlleqfqjgnkcjlrc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_9q5KNgJ4lLvWqqn0IdIlBw_KIAWNxgR";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let currentAssignment = null;

  function formatTime12Hour(timeValue) {
    if (!timeValue) return "—";

    const parts = timeValue.split(":");
    let hour = parseInt(parts[0], 10);
    const minute = parts[1] || "00";

    const ampm = hour >= 12 ? "PM" : "AM";

    hour = hour % 12;
    hour = hour || 12;

    return `${hour}:${minute} ${ampm}`;
  }

  function saveAssignmentForObserverFlow(assignment) {
    const savedRequest = {
      id: assignment.id,
      agentName: assignment.agent_name || "",
      address: assignment.property_address || "",
      city: assignment.city || "",
      state: assignment.state || "",
      zip: assignment.zip || "",
      date: assignment.date || "",
      time: assignment.time || "",
      displayTime: formatTime12Hour(assignment.time),
      duration: assignment.duration || "",
      status: assignment.status || "pending"
    };

    localStorage.setItem(
      "realtorGuardAgentRequest",
      JSON.stringify(savedRequest)
    );
    localStorage.setItem(
  "realtorGuardCurrentAssignment",
  JSON.stringify(savedRequest)
);
  }

async function loadAssignments() {
  const { data, error } = await supabaseClient
    .from("assignments")
    .select("*")
    .eq("status", "pending")
    .order("created_at", { ascending: false });

  const container = document.getElementById("assignmentsContainer");

  if (error) {
    console.error("Supabase load error:", error);
    container.innerHTML = "<p>Unable to load assignments.</p>";
    return;
  }

  if (!data || data.length === 0) {
    container.innerHTML = "<p>No assignments are currently available.</p>";
    return;
  }

  container.innerHTML = "";

  data.forEach((assignment) => {
    const card = document.createElement("article");
    card.className = "assignment-card";

    card.innerHTML = `
      <h3>Agent Safety Assignment</h3>

      <p class="detail">
        <strong>Agent:</strong>
        <span>${assignment.agent_name || "—"}</span>
      </p>

      <p class="detail">
        <strong>Property Address:</strong>
        <span>${assignment.property_address || "—"}</span>
      </p>

      <p class="detail">
        <strong>City:</strong>
        <span>${assignment.city || "—"}</span>
      </p>

      <p class="detail">
        <strong>State:</strong>
        <span>${assignment.state || "—"}</span>
      </p>

      <p class="detail">
        <strong>ZIP:</strong>
        <span>${assignment.zip || "—"}</span>
      </p>

      <p class="detail">
        <strong>Date:</strong>
        <span>${assignment.date || "—"}</span>
      </p>

      <p class="detail">
        <strong>Time:</strong>
        <span>${formatTime12Hour(assignment.time)}</span>
      </p>

      <p class="detail">
        <strong>Time Zone:</strong>
        <span>${assignment.timezone || "—"}</span>
      </p>

      <p class="detail">
        <strong>Duration:</strong>
        <span>${assignment.duration || "—"}</span>
      </p>

      <div class="pay-box">
       Observer Pay: $30/HR Guaranteed
      </div>

      <p class="privacy-note">
        Pay information is only visible to approved observers.
      </p>

      <button
        class="accept-button"
        type="button"
        onclick="acceptAssignment(${assignment.id})"
      >
        Accept Assignment
      </button>
    `;

    container.appendChild(card);
  });
}  

  
async function acceptAssignment(assignmentId) {
  const { data, error } = await supabaseClient
    .from("assignments")
    .update({ status: "accepted" })
    .eq("id", assignmentId)
    .select()
    .single();

  if (error) {
    console.error("Error accepting assignment:", error);
    alert("Unable to accept this assignment. Please try again.");
    return;
  }

  currentAssignment = data;

  saveAssignmentForObserverFlow(data);

  localStorage.setItem(
    "realtorGuardAssignmentAccepted",
    "true"
  );

  localStorage.setItem(
    "realtorGuardAcceptedAt",
    new Date().toISOString()
  );

  window.location.href = "on-my-way.html";
}
function toggleStatus() {
  const button = document.getElementById("statusButton");

  if (button.textContent.trim() === "Available") {
    button.textContent = "Busy";
    button.style.background = "#777777";
  } else {
    button.textContent = "Available";
    button.style.background = "#168437";
  }
}    

 
  loadAssignments();
</script>
  
</body>
</html>
