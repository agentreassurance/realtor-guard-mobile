<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observer Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#ffffff;
}

header{
    background:#c00000;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:500px;
    margin:20px auto;
    padding:20px;
}

.card{
    border:1px solid #ccc;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
}

h2{
    color:#c00000;
    text-align:center;
}

.info{
    margin:10px 0;
    font-size:18px;
}

.pay{
    color:green;
    font-weight:bold;
    font-size:22px;
    text-align:center;
    margin:20px 0;
}

button{
    width:100%;
    padding:15px;
    background:#c00000;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#990000;
}
</style>

</head>

<body>

<header>
<h1>Observer Dashboard</h1>
</header>

<div class="container">

<div class="card">

<h2>Available Assignment</h2>

<div class="info"><strong>City:</strong> Richmond, VA</div>

<div class="info"><strong>Date:</strong> July 31, 2026</div>

<div class="info"><strong>Time:</strong> 2:00 PM</div>

<div class="info"><strong>Duration:</strong> 2 Hours</div>

<div class="pay">$75 Observer Pay</div>

<button onclick="location.href='accepted.html'">
Accept Assignment
</button>

</div>

</div>

</body>
</html>
