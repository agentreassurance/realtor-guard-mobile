<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Pending | Realtor Guard</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:420px;
    text-align:center;
}

.logo{
    width:90px;
    margin-bottom:10px;
}

h1{
    color:#b71c1c;
    margin-bottom:10px;
}

.status{
    background:#fff3cd;
    color:#856404;
    padding:12px;
    border-radius:8px;
    margin-bottom:20px;
    font-weight:bold;
}

.card{
    text-align:left;
    border:1px solid #ddd;
    border-radius:10px;
    padding:16px;
    margin-bottom:20px;
}

.card p{
    margin:10px 0;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.refresh{
    background:#b71c1c;
    color:white;
}

.cancel{
    background:#555;
    color:white;
}
</style>

</head>

<body>

<div class="container">

<img src="../logo.png" class="logo">

<h1>Confirm Request</h1>

<div class="card">
  <p><strong>Agent:</strong> <span id="requestAgent"></span></p>
  <p><strong>Property:</strong> <span id="requestAddress"></span></p>
  <p><strong>City:</strong> <span id="requestCity"></span></p>
  <p><strong>State:</strong> <span id="requestState"></span></p>
  <p><strong>Zip:</strong> <span id="requestZip"></span></p>
  <p><strong>Date:</strong> <span id="requestDate"></span></p>
  <p><strong>Time:</strong> <span id="requestTime"></span></p>
  <p><strong>Duration:</strong> <span id="requestDuration"></span></p>
  <p><strong>Time Zone:</strong> <span id="requestTimezone"></span></p>
</div>

<button class="refresh" id="approveRequest">
  Approve & Submit
</button>

<button class="cancel" onclick="localStorage.setItem('realtorGuardEditMode','true'); window.location.href='dashboard.html'">
  Edit Request
</button>
</div>
<script>
const request = JSON.parse(
    localStorage.getItem("realtorGuardAgentRequest")
);

if (request) {
    document.getElementById("requestAgent").textContent =
        request.agent_name || request.agentName || request.fullName || "—";

    document.getElementById("requestAddress").textContent =
        request.property_address || request.address || "—";

    document.getElementById("requestCity").textContent =
        request.city || "—";

    document.getElementById("requestState").textContent =
        request.state || "—";

    document.getElementById("requestZip").textContent =
        request.zip || "—";

    document.getElementById("requestDate").textContent =
        request.date || "—";

    document.getElementById("requestTime").textContent =
        request.time || "—";

    document.getElementById("requestDuration").textContent =
        request.duration || "—";

    document.getElementById("requestTimezone").textContent =
        request.timezone || request.time_zone || "—";
}
document.getElementById("approveRequest").addEventListener("click", function () {
    localStorage.setItem("realtorGuardAgentRequest", JSON.stringify(request));
    localStorage.setItem("realtorGuardRequestStatus", "pending");
    window.location.replace("pending.html");
}); 
</script>
</body>
</html>
