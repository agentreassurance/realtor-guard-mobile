<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Login</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#ffffff;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }

    .container{
      width:90%;
      max-width:400px;
      text-align:center;
    }

    img{
      width:120px;
      margin-bottom:20px;
    }

    h1{
      color:#b22222;
      margin-bottom:25px;
    }

    input{
      width:100%;
      padding:15px;
      margin:10px 0;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:20px;
      background:#b22222;
      color:white;
      border:none;
      border-radius:8px;
      font-size:18px;
      cursor:pointer;
    }

    button:hover{
      background:#8b0000;
    }

    .link{
      margin-top:20px;
    }

    a{
      color:#b22222;
      text-decoration:none;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="container">

<img src="../logo.png" alt="Realtor Guard Logo">

<h1>Agent Login</h1>

<input id="email" type="email" placeholder="Email Address">

<input id="password" type="password" placeholder="Password">
<button type="button" onclick="togglePassword()">👁️</button>
<button type="button" onclick="loginAgent()">
Login
</button>

<div class="link"><a href="#" onclick="forgotPassword(); return false;">Forgot Password?</a></div>  

<div class="link">
<a href="signup.html">Create New Agent Account</a>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
<script>
const SUPABASE_URL = "https://ujnvhlleqfqjgnkcjlrc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9q5KNgJ4lLvWqqn0IdIlBw_KIAWNxgR";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);
const params = new URLSearchParams(window.location.search);

if (params.get("reset") === "success") {
  const passwordField = document.getElementById("password");

  passwordField.value = "";

  setTimeout(() => {
    passwordField.value = "";
  }, 300);

  alert("Password updated successfully. Please enter your new password.");

  window.history.replaceState({}, document.title, "login.html");
}
async function loginAgent() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Please enter your email and password.");
    return;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert("Incorrect email or password.");
    return;
  }

  if (data.user) {
    window.location.href = "dashboard.html";
  }
}

function togglePassword() {
  const password = document.getElementById("password");

  if (password.type === "password") {
    password.type = "text";
  } else {
    password.type = "password";
  }
}
async function forgotPassword() {
  const email = document.getElementById("email").value.trim();

  if (!email) {
    alert("Please enter your email address first.");
    return;
  }

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
  redirectTo: "https://agentreassurance.github.io/realtor-guard-mobile/agent/reset-password.html"
});

  if (error) {
    alert("Unable to send password reset email. Please try again.");
    return;
  }

  alert("Password reset email sent. Please check your email.");
}
  
</script>
</body>
</html>
