<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Login</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#ffffff;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }

    .container{
      width:90%;
      max-width:400px;
      text-align:center;
    }

    img{
      width:120px;
      margin-bottom:20px;
    }

    h1{
      color:#b22222;
      margin-bottom:25px;
    }

    input{
      width:100%;
      padding:15px;
      margin:10px 0;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:20px;
      background:#b22222;
      color:white;
      border:none;
      border-radius:8px;
      font-size:18px;
      cursor:pointer;
    }

    button:hover{
      background:#8b0000;
    }

    .link{
      margin-top:20px;
    }

    a{
      color:#b22222;
      text-decoration:none;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="container">

<img src="../logo.png" alt="Realtor Guard Logo">

<h1>Agent Login</h1>

<input type="email" placeholder="Email Address">

<input type="password" placeholder="Password">

<button onclick="window.location.href='dashboard.html'">
Login
</button>

<div class="link">
<a href="signup.html">Create New Agent Account</a>
</div>

</div>

</body>
</html>
