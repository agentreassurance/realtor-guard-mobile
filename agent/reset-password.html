<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create New Password</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    img {
      width: 130px;
      margin-bottom: 25px;
    }

    h1 {
      color: #b91f24;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      margin-bottom: 18px;
      font-size: 17px;
      border: 1px solid #999;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 16px;
      background: #b91f24;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <img src="../logo.png" alt="Realtor Guard">

  <h1>Create New Password</h1>

  <input
    type="password"
    id="newPassword"
    placeholder="New Password"
  >

  <input
    type="password"
    id="confirmPassword"
    placeholder="Confirm New Password"
  >

  <button onclick="updatePassword()">Save New Password</button>

  <div id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://ujnvhlleqfqjgnkcjlcr.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_9q5KNgJ4lLvWqqn0IdIlBw_KIAWNxgR";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  async function updatePassword() {

    const newPassword =
      document.getElementById("newPassword").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    const message =
      document.getElementById("message");

    if (!newPassword || !confirmPassword) {
      message.style.color = "red";
      message.textContent = "Please complete both password fields.";
      return;
    }

    if (newPassword !== confirmPassword) {
      message.style.color = "red";
      message.textContent = "Passwords do not match.";
      return;
    }

    if (newPassword.length < 6) {
      message.style.color = "red";
      message.textContent =
        "Password must contain at least 6 characters.";
      return;
    }

    const { error } =
      await supabaseClient.auth.updateUser({
        password: newPassword
      });

    if (error) {
      message.style.color = "red";
      message.textContent =
        "Unable to update password: " + error.message;
      return;
    }

    message.style.color = "green";
    message.textContent =
      "Password successfully changed. Returning to login...";

    setTimeout(() => {
      window.location.href = "login.html";
    }, 2000);
  }
</script>

</body>
</html>
